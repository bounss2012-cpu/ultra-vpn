<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Manager - Ultra-Performant Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .status-active {
            background: #10b981;
            color: white;
        }

        .status-inactive {
            background: #ef4444;
            color: white;
        }

        .status-loading {
            background: #f59e0b;
            color: white;
        }

        /* Dashboard Cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .card-title {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .card-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        /* Add Client Form */
        .add-client-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .add-client-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-control {
            flex: 1;
            min-width: 200px;
        }

        .form-control label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        .form-control input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-control input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-download {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-download:hover {
            background: #059669;
        }

        /* Clients Table */
        .clients-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .clients-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9fafb;
        }

        th {
            padding: 15px;
            text-align: left;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .badge-connected {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        /* Messages */
        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                text-align: center;
            }

            .header h1 {
                font-size: 2em;
            }

            .form-group {
                flex-direction: column;
            }

            .form-control {
                width: 100%;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🚀 VPN Manager</h1>
                <p>Ultra-Performant WireGuard Dashboard</p>
            </div>
            <div class="server-status status-loading" id="serverStatus">
                <div class="spinner"></div>
                <span>Checking...</span>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="dashboard">
            <div class="card">
                <div class="card-icon">👥</div>
                <div class="card-title">Total Clients</div>
                <div class="card-value" id="totalClients">0</div>
            </div>
            <div class="card">
                <div class="card-icon">✅</div>
                <div class="card-title">Connected</div>
                <div class="card-value" id="connectedClients">0</div>
            </div>
            <div class="card">
                <div class="card-icon">🌍</div>
                <div class="card-title">Region</div>
                <div class="card-value" style="font-size: 1.5em;">Global</div>
            </div>
        </div>

        <!-- Add Client Form -->
        <div class="add-client-section">
            <h2>➕ Add New Client</h2>
            <div id="message" class="message"></div>
            <form id="addClientForm" class="form-group">
                <div class="form-control">
                    <label for="clientName">Client Name</label>
                    <input 
                        type="text" 
                        id="clientName" 
                        name="clientName" 
                        placeholder="e.g., john-laptop" 
                        pattern="[a-zA-Z0-9-]+"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary">
                    <span id="addBtnText">Add Client</span>
                </button>
            </form>
        </div>

        <!-- Clients List -->
        <div class="clients-section">
            <h2>📋 VPN Clients</h2>
            <div class="table-container">
                <table id="clientsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>IP Address</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr>
                            <td colspan="4" class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <div>Loading clients...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let refreshInterval;

        // Show message
        function showMessage(message, type = 'success') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `message message-${type} show`;
            
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        // Update server status
        async function updateServerStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const statusEl = document.getElementById('serverStatus');
                if (data.success && data.active) {
                    statusEl.className = 'server-status status-active';
                    statusEl.innerHTML = '<span>🟢</span><span>Server Active</span>';
                } else {
                    statusEl.className = 'server-status status-inactive';
                    statusEl.innerHTML = '<span>🔴</span><span>Server Inactive</span>';
                }
            } catch (error) {
                console.error('Error updating status:', error);
                const statusEl = document.getElementById('serverStatus');
                statusEl.className = 'server-status status-inactive';
                statusEl.innerHTML = '<span>⚠️</span><span>Error</span>';
            }
        }

        // Update clients list
        async function updateClients() {
            try {
                const response = await fetch('/api/clients');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Failed to fetch clients');
                }

                const clients = data.clients || [];
                const tbody = document.getElementById('clientsTableBody');
                
                // Update stats
                document.getElementById('totalClients').textContent = clients.length;
                document.getElementById('connectedClients').textContent = 
                    clients.filter(c => c.connected).length;

                // Update table
                if (clients.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <div>No clients yet. Add your first client above!</div>
                            </td>
                        </tr>
                    `;
                } else {
                    tbody.innerHTML = clients.map(client => `
                        <tr>
                            <td><strong>${escapeHtml(client.name)}</strong></td>
                            <td>${escapeHtml(client.ip)}</td>
                            <td>
                                <span class="badge ${client.connected ? 'badge-connected' : 'badge-disconnected'}">
                                    ${client.connected ? '🟢 Connected' : '⚪ Disconnected'}
                                </span>
                            </td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-download" onclick="downloadConfig('${escapeHtml(client.name)}')">
                                        📥 Download
                                    </button>
                                    <button class="btn btn-danger" onclick="removeClient('${escapeHtml(client.name)}')">
                                        🗑️ Remove
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error updating clients:', error);
            }
        }

        // Add client
        document.getElementById('addClientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const clientName = document.getElementById('clientName').value.trim();
            const addBtn = document.getElementById('addBtnText');
            const originalText = addBtn.textContent;
            
            addBtn.innerHTML = '<div class="spinner"></div>';
            
            try {
                const response = await fetch('/api/clients/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: clientName })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                    document.getElementById('clientName').value = '';
                    await updateClients();
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            } finally {
                addBtn.textContent = originalText;
            }
        });

        // Download config
        async function downloadConfig(name) {
            try {
                window.location.href = `/api/download/${encodeURIComponent(name)}`;
            } catch (error) {
                showMessage(`❌ Error downloading config: ${error.message}`, 'error');
            }
        }

        // Remove client
        async function removeClient(name) {
            if (!confirm(`Are you sure you want to remove client "${name}"?`)) {
                return;
            }
            
            try {
                const response = await fetch('/api/clients/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                    await updateClients();
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize dashboard
        async function initDashboard() {
            await updateServerStatus();
            await updateClients();
            
            // Auto-refresh every 10 seconds
            refreshInterval = setInterval(async () => {
                await updateServerStatus();
                await updateClients();
            }, 10000);
        }

        // Start dashboard on page load
        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
